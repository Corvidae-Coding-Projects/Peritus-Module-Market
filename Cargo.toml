[workspace]
members = ["sdk/peritus-plugin-sdk", "modules/*"]
exclude = ["templates/rust-plugin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Corvidae-Coding-Projects/Peritus-Module-Market"

[workspace.dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
toml = "=1.1.4"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
